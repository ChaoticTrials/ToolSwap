name: publish

on:
  push:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      prev_commit: ${{ steps.prev.outputs.prev_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find last successful publish SHA
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/publish.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1&exclude_pull_requests=true" \
            --jq '.workflow_runs[0].head_sha // ""')

          # Drop it if the commit is no longer in history (e.g. force-push)
          if [ -n "$prev" ] && ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "Previous SHA $prev no longer in history, falling back"
            prev=""
          fi

          # Fallbacks for first run or missing history
          if [ -z "$prev" ]; then
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              prev="$before"
            else
              prev=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            fi
          fi

          echo "prev_commit=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous successful SHA: $prev"

      - name: Check for non-meta commits
        id: check
        run: |
          prev='${{ steps.prev.outputs.prev_commit }}'
          if [ -z "$prev" ]; then
            echo "No previous commit found — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commits=$(git log "$prev..${{ github.sha }}" --pretty=format:'%s')
          if [ -z "$commits" ]; then
            echo "No commits in range."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits since last successful publish:"
          echo "$commits"
          if echo "$commits" | grep -qv '^\[meta\]'; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only [meta] commits, skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Publish
        env:
          PREV: ${{ needs.check.outputs.prev_commit }}
          HEAD_SHA: ${{ github.sha }}
          ORG_GRADLE_PROJECT_melanxUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_melanxPassword: ${{ secrets.MAVEN_PASSWORD }}
          CURSEFORGE_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_UPLOAD_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -n "$PREV" ]; then
            export GIT_COMMIT="$HEAD_SHA"
            export GIT_PREVIOUS_COMMIT="$PREV"
            export GIT_PREVIOUS_SUCCESSFUL_COMMIT="$PREV"
          fi
          ./gradlew build publish upload
